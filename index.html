<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘 뭐 해먹지</title>
<meta name="description" content="냉장고 재료와 난이도를 고르면 요리를 추천하고 손질법과 레시피를 알려줍니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 냉장고 안쪽: 차가운 선반색 바탕, 재료는 선반 칸, 난이도는 온도 조절 다이얼처럼 */
:root{--bg:#e9f0f1;--shelf:#f8fbfb;--ink:#17302f;--soft:#587170;--line:#c9d8d9;--accent:#0b6e69;--on-accent:#fff;--warm:#d9480f;--have:#dff3e4;--have-ink:#17603a;--miss:#fde8dc;--miss-ink:#a33a0b;
--display:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;--body:var(--display)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101b1c;--shelf:#182627;--ink:#e6f0ef;--soft:#9db3b2;--line:#2e4243;--accent:#4cc4bb;--on-accent:#06302d;--warm:#ff9a66;--have:#173a28;--have-ink:#9be3b4;--miss:#47250f;--miss-ink:#ffc09b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101b1c;--shelf:#182627;--ink:#e6f0ef;--soft:#9db3b2;--line:#2e4243;--accent:#4cc4bb;--on-accent:#06302d;--warm:#ff9a66;--have:#173a28;--have-ink:#9be3b4;--miss:#47250f;--miss-ink:#ffc09b;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--body);letter-spacing:-.01em;word-break:keep-all;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 88px}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.25;margin:0;text-wrap:balance;letter-spacing:-.025em}
h1{font-size:clamp(2rem,6vw,2.75rem);font-weight:800;color:var(--accent)}
h2{font-size:1.4rem}h3{font-size:1.1rem;font-weight:600}
p{margin:0}
header p{color:var(--soft)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.panel{background:var(--shelf);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#q{flex:1 1 200px;min-width:0;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.btn{padding:10px 16px;border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:600}
.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:36px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:0;border-radius:99px;background:var(--have);color:var(--have-ink)}
.chip.custom{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.note{font-size:.88rem;color:var(--soft)}
.grid-ing{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;max-height:300px;overflow-y:auto;padding:2px}
.ing{position:relative;padding:0;border:2px solid transparent;border-radius:10px;background:none;text-align:center;font-size:.86rem;overflow:hidden}
.ing .ph{height:62px;border-radius:8px}
.ing[aria-pressed="true"]{border-color:var(--accent);font-weight:700}
.ing[aria-pressed="true"]::after{content:"✓";position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);line-height:22px}
.ph{display:block;width:100%;object-fit:cover;background:var(--line)}
.tile{display:grid;place-items:center;font-weight:600;color:var(--accent);background:var(--bg);border:1px dashed var(--line);text-align:center;padding:4px}
.sea{padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:none}
.sea[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.between{justify-content:space-between}
.small{padding:6px 10px;font-size:.86rem}
.check{display:flex;align-items:center;gap:8px;cursor:pointer}
.check{padding:9px 14px;border-radius:10px;background:#ffd43b;color:#2b2200;font-weight:700;box-shadow:0 2px 0 #d9a900}
.check:hover{background:#ffe066}
.check:has(input:checked){background:#fab005;box-shadow:inset 0 0 0 2px #2b2200}
.check input{width:20px;height:20px;accent-color:#2b2200}
.lv .cnt{display:block;font-weight:600}
.pill.opt{background:var(--bg);color:var(--soft);border:1px solid var(--line)}
td:nth-child(2):has(.pill){white-space:nowrap}
#rs{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.jump{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;max-width:calc(100vw - 32px);padding:12px 20px;border:0;border-radius:99px;background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.3);font-variant-numeric:tabular-nums}
.chip,.chip.custom{background:#f4801f;color:#2b1200;border:0;font-weight:600}
.ing[aria-pressed="true"]{border-color:#f4801f;color:#f4801f}
.ing[aria-pressed="true"]::after{background:#f4801f;color:#2b1200}
.sea[aria-pressed="true"],.levels .lv[aria-pressed="true"]{background:#f4801f;border-color:#f4801f;color:#2b1200}
.levels .lv[aria-pressed="true"] small{color:#2b1200}
.results{scroll-margin-top:12px;display:flex;flex-direction:column;gap:12px}
.stepimg{display:block;width:100%;max-width:420px;margin-top:8px;border-radius:10px;background:var(--line)}
.parts{margin-top:8px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{padding:10px 6px;border:2px solid var(--line);border-radius:12px;background:none;line-height:1.3}
.lv b{display:block;font-size:1.15rem;font-weight:700}
.lv small{color:var(--soft)}
.lv[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.lv[aria-pressed="true"] small{color:inherit}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{display:flex;flex-direction:column;padding:0;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--shelf);overflow:hidden;color:inherit;text-decoration:none}
.card:hover{border-color:var(--accent)}
.card .ph{aspect-ratio:16/10;height:auto;max-width:100%}
.card .in{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.84rem;background:var(--have);color:var(--have-ink)}
.pill.miss{background:var(--miss);color:var(--miss-ink)}
.detail{display:flex;flex-direction:column;gap:24px;max-width:780px;margin:0 auto;width:100%}
.hero{width:100%;aspect-ratio:16/9;height:auto;border-radius:14px;max-width:100%}
.meta{color:var(--soft);font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td:last-child{text-align:right;white-space:nowrap}
.mini{width:44px;height:44px;border-radius:8px;flex:none;font-size:.72rem;line-height:1.1}
.nm{display:flex;align-items:center;gap:10px}
.prep{display:grid;grid-template-columns:120px minmax(0,1fr);gap:14px;padding-block:14px;border-top:1px solid var(--line)}
.prep .ph{height:96px;border-radius:10px}
ol{margin:0;padding-left:1.3em}
.steps{list-style:none;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:700;display:grid;place-items:center}
.thumbs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tip{background:var(--miss);color:var(--miss-ink);padding:12px 14px;border-radius:12px}
footer{font-size:.88rem;color:var(--soft)}
a{color:var(--accent)}
.credits{display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
@media(max-width:480px){.prep{grid-template-columns:1fr}.prep .ph{height:150px}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
